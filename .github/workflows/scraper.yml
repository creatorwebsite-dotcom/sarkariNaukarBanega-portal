name: Automated Recruitment Sync

on:
  schedule:
    - cron: '0 3 * * *'  # Daily 8:30 AM IST
  workflow_dispatch:      # Manual trigger button

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install beautifulsoup4

      - name: Run Hybrid Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python multi_agent_scraper.py

      - name: Commit and Push Database
        run: |
          git config --global user.name "SarkariPortal-Bot"
          git config --global user.email "bot@sarkarinaukar.com"
          git add jobs_database.json
          git commit -m "Auto-sync recruitment feeds via Hybrid Engine" || exit 0
          git push
